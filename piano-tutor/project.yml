# Xcode project definition. Generate the project on a Mac with:  ./setup.sh
name: PianoTutor
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PianoCore:
    path: PianoCore
targets:
  PianoTutor:
    type: application
    platform: iOS
    sources:
      - path: App/PianoTutor
        excludes:
          - "Resources/**"
      - path: App/PianoTutor/Resources/notation
        type: folder
        buildPhase: resources
    dependencies:
      - package: PianoCore
        product: PianoCore
    info:
      path: App/PianoTutor/Info.plist
      properties:
        CFBundleDisplayName: Piano Tutor
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to connect to your digital piano so the app can hear what you play."
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pianotutor
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PianoTutor:
    build:
      targets:
        PianoTutor: all
    run:
      config: Debug
